<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>电子黄历 · 求签</title>
    <style>
        * { font-family: "SimSun", "宋体", serif; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: #f8f3e9; overflow-x: hidden; perspective: 1600px; margin: 0; padding: 0; }

        .cover-wrap {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; transition: opacity 0.6s ease;
        }
        .book-cover {
            width: min(85vw, 420px); aspect-ratio: 3/4;
            background: #992222; border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff8dc; position: relative; transform-origin: left center;
            transition: transform 1s ease, opacity 0.8s ease;
        }
        .book-cover h1 { font-size: clamp(2rem, 8vw, 3rem); letter-spacing: 0.3em; margin: 0; }
        .open-btn {
            margin-top: 40px; padding: 14px 32px; background: #ddaa44;
            color: #661111; border-radius: 8px; font-size: 18px;
            border: none; cursor: pointer; transition: 0.3s; -webkit-appearance: none;
        }
        .open-btn:active { background: #f0bc58; transform: scale(0.98); }

        .book-page-wrap {
            display: none; min-height: 100vh; align-items: center;
            justify-content: center; padding: 30px 15px;
        }
        .book-page {
            width: min(90vw, 600px); background: #fffcf5;
            border: 1px solid #d8c8b0; border-radius: 4px;
            padding: 40px 30px; box-shadow: 0 10px 30px rgba(80,40,0,0.18);
            transform-origin: left center; transform-style: preserve-3d;
            backface-visibility: hidden;
            animation: pageOpen 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes pageOpen {
            0% { transform: rotateY(-95deg); opacity: 0.2; box-shadow: -20px 10px 40px rgba(80,40,0,0.35); }
            60% { opacity: 0.85; }
            100% { transform: rotateY(0deg); opacity: 1; box-shadow: 0 10px 30px rgba(80,40,0,0.18); }
        }

        .date-title { text-align: center; font-size: clamp(1.4rem, 5vw, 1.8rem); margin-bottom: 32px; color: #702020; }
        .grid-huangli { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .huangli-block { padding: 16px; border: 1px solid #e2d6c2; border-radius: 6px; }
        .huangli-block h3 {
            font-size: 1.1rem; color: #883333; font-weight: bold;
            margin-bottom: 8px; border-bottom: 1px solid #e8ddcb; padding-bottom: 4px;
        }
        .huangli-block p { font-size: 1rem; line-height: 1.7; color: #333; margin: 0; }
        .color-line { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; line-height: 1.8; }
        .color-swatch {
            display: inline-block; width: 16px; height: 16px;
            border-radius: 3px; border: 1px solid rgba(0,0,0,0.15); flex-shrink: 0;
        }
        .note-list { list-style: none; padding: 0; margin: 0; }
        .note-list li { position: relative; padding-left: 18px; line-height: 1.9; font-size: 1rem; color: #333; }
        .note-list li::before { content: "·"; position: absolute; left: 4px; color: #883333; font-weight: bold; }
        @media (max-width: 500px) { .grid-huangli { grid-template-columns: 1fr; } }

        .term-list { display: flex; flex-wrap: wrap; gap: 8px; }
        .term-tag {
            display: inline-block; padding: 4px 12px; background: #fdf6e9;
            border: 1px solid #e2d6c2; border-radius: 14px; font-size: 0.95rem;
            color: #883333; cursor: pointer; transition: 0.2s; line-height: 1.6;
        }
        .term-tag:active { background: #f0e2c8; transform: scale(0.96); }

        .divine-section { margin-top: 28px; padding-top: 24px; border-top: 1px dashed #d8c8b0; text-align: center; }
        .divine-btn {
            padding: 14px 48px; background: #883333; color: #fff8dc;
            border: none; border-radius: 8px; font-size: 1.2rem;
            cursor: pointer; transition: 0.3s; letter-spacing: 0.2em; -webkit-appearance: none;
        }
        .divine-btn:active:not(:disabled) { background: #aa4444; transform: scale(0.98); }
        .divine-btn:disabled { background: #c9b8a8; cursor: not-allowed; transform: none; }
        .divine-result {
            margin-top: 20px; padding: 20px; background: #fdf8ee;
            border: 1px solid #e2d6c2; border-radius: 8px; display: none;
        }
        .divine-result .qian-name { font-size: 1.4rem; color: #883333; font-weight: bold; margin-bottom: 8px; }
        .divine-result .qian-level { font-size: 0.95rem; color: #996633; margin-bottom: 12px; }
        .divine-result .qian-poem { font-size: 1rem; line-height: 1.9; color: #444; white-space: pre-line; }
        .download-btn {
            margin-top: 16px; padding: 10px 28px; background: #ddaa44;
            color: #661111; border: none; border-radius: 6px;
            font-size: 1rem; cursor: pointer; transition: 0.3s; -webkit-appearance: none;
        }
        .download-btn:active { background: #f0bc58; }
        .loading-tip { color: #996633; font-size: 0.95rem; margin-top: 12px; }

        .term-modal-mask {
            position: fixed; inset: 0; background: rgba(40, 20, 10, 0.55);
            display: none; align-items: center; justify-content: center;
            z-index: 999; padding: 24px;
        }
        .term-modal-mask.show { display: flex; }
        .term-modal {
            width: min(88vw, 420px); background: #fffcf5;
            border: 1px solid #d8c8b0; border-radius: 10px;
            padding: 28px 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.35);
            animation: modalIn 0.25s ease-out;
        }
        @keyframes modalIn {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .term-modal .term-word {
            font-size: 1.5rem; color: #883333; font-weight: bold;
            text-align: center; margin-bottom: 6px;
        }
        .term-modal .term-cat {
            text-align: center; font-size: 0.9rem; color: #996633; margin-bottom: 16px;
        }
        .term-modal .term-body {
            font-size: 1rem; line-height: 1.9; color: #333;
            max-height: 50vh; overflow-y: auto; padding-right: 4px;
        }
        .term-modal .term-body p { margin: 0 0 12px 0; }
        .term-modal .term-body .label { color: #883333; font-weight: bold; }
        .term-modal .back-btn {
            display: block; width: 100%; margin-top: 20px;
            padding: 12px 0; background: #883333; color: #fff8dc;
            border: none; border-radius: 8px; font-size: 1.05rem;
            cursor: pointer; transition: 0.3s; -webkit-appearance: none;
            letter-spacing: 0.1em;
        }
        .term-modal .back-btn:active { background: #aa4444; }
    </style>
</head>
<body>
    <div id="cover" class="cover-wrap">
        <div class="book-cover" id="bookCover">
            <h1>电子黄历</h1>
            <p style="margin-top:16px;opacity:0.8;font-size:14px;">择吉 · 观时 · 求签</p>
            <button class="open-btn" onclick="openBook()">打开电子黄历</button>
        </div>
    </div>

    <div id="pageWrap" class="book-page-wrap">
        <div class="book-page">
            <div class="date-title">
                <div id="solarDate">加载中...</div>
                <div id="lunarDate" style="margin-top:8px;font-size:1.1rem;"></div>
            </div>
            <div class="grid-huangli">
                <div class="huangli-block">
                    <h3>✅ 宜（适合做）</h3>
                    <div id="yiText" class="term-list"></div>
                </div>
                <div class="huangli-block">
                    <h3>👔 推荐穿搭颜色</h3>
                    <p id="goodColor" class="color-line"></p>
                </div>
                <div class="huangli-block">
                    <h3>❌ 忌（避免）</h3>
                    <div id="jiText" class="term-list"></div>
                </div>
                <div class="huangli-block">
                    <h3>🚫 慎穿颜色</h3>
                    <p id="badColor" class="color-line"></p>
                </div>
                <div class="huangli-block" style="grid-column:1/-1;">
                    <h3>📌 今日注意事项</h3>
                    <ul id="noteText" class="note-list"></ul>
                </div>
            </div>

            <div class="divine-section">
                <button id="divineBtn" class="divine-btn" onclick="drawDivine()">求签</button>
                <div id="divineResult" class="divine-result"></div>
                <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadImage()">📥 保存签文图片</button>
                <div id="loadingTip" class="loading-tip" style="display:none;">正在生成图片...</div>
            </div>
        </div>
    </div>

    <div id="termModalMask" class="term-modal-mask" onclick="closeTermModal(event)">
        <div class="term-modal" onclick="event.stopPropagation()">
            <div class="term-word" id="termWord"></div>
            <div class="term-cat" id="termCat"></div>
            <div class="term-body" id="termBody"></div>
            <button class="back-btn" onclick="closeTermModal()">返回电子黄历</button>
        </div>
    </div>

        '打扫': { cat: '忌', meaning: '清扫整理', usage: '此日不宜大扫除。' },
        '起基': { cat: '忌', meaning: '建筑奠基', usage: '此日不宜奠基。' },
    '解除': { cat: '忌', meaning: '冲洗清扫、解除灾厄', usage: '此日不宜做大扫除、清理宅舍。' },
    '坏垣': { cat: '忌', meaning: '拆除围墙、拆房扒墙', usage: '此日不宜拆墙、拆房。' },
    '馀事勿取': { cat: '忌', meaning: '除此之外，其余事情不宜做', usage: '此日不宜做“宜”栏以外的其他事情。' },
    '诸事不宜': { cat: '忌', meaning: '本日不宜办大事', usage: '此日不宜办结婚、开业、搬家等大事，宜静不宜动。' }
    };

    function getTermInfo(word, category) {
        if (category === '忌' && termDictJi[word]) return termDictJi[word];
        if (category === '宜' && termDict[word]) return termDict[word];
        if (termDictJi[word]) return termDictJi[word];
        if (termDict[word]) return termDict[word];
        return {
            cat: category,
            meaning: word,
            usage: '该词条释义暂未收录，可参考传统黄历通用解释。'
        };
    }

    // ============ 本地黄历计算 ============
    function getHuangliLocal() {
        const now = new Date();
        let lunar;
        try {
            const solar = Solar.fromYmd(now.getFullYear(), now.getMonth() + 1, now.getDate());
            lunar = solar.getLunar();
        } catch(e) {
            return {
                solarDate: now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日',
                lunarDate: '农历库未加载',
                yiArr: [], jiArr: [], yi: '无', ji: '无',
                goodColor: '白色、银色、浅灰色', badColor: '红色、深紫色',
                notes: ['请确认 lunar.js 与 index.html 在同一目录下。']
            };
        }

        const yiArr = lunar.getDayYi() || [];
        const jiArr = lunar.getDayJi() || [];

        let chongSha = '';
        try { chongSha = '冲' + lunar.getDayChongDesc() + ' 煞' + lunar.getDaySha(); }
        catch(e) { chongSha = '暂无'; }

        let caiPosition = '';
        try { caiPosition = lunar.getDayPositionCaiDesc() || '暂无'; }
        catch(e) { caiPosition = '暂无'; }

        return {
            solarDate: now.getFullYear() + '年' + (now.getMonth() + 1) + '月' + now.getDate() + '日',
            lunarDate: lunar.getYearInChinese() + '年' + lunar.getMonthInChinese() + '月' + lunar.getDayInChinese(),
            yiArr: yiArr, jiArr: jiArr,
            yi: yiArr.length > 0 ? yiArr.join('、') : '无',
            ji: jiArr.length > 0 ? jiArr.join('、') : '无',
            goodColor: '白色、银色、浅灰色',
            badColor: '红色、深紫色',
            notes: [
                '干支：' + lunar.getYearInGanZhi() + '年 ' + lunar.getMonthInGanZhi() + '月 ' + lunar.getDayInGanZhi() + '日',
                '冲煞：' + chongSha,
                '财神方位：' + caiPosition
            ]
        };
    }

    const colorMap = {
        '白色': '#ffffff', '银色': '#c0c0c0', '浅灰色': '#d3d3d3', '灰色': '#808080',
        '红色': '#e60012', '深紫色': '#4b0082', '紫色': '#800080', '黑色': '#000000',
        '蓝色': '#1e90ff', '深蓝色': '#000080', '绿色': '#2e8b57', '黄色': '#ffd700',
        '金色': '#d4af37', '粉色': '#ffb6c1', '橙色': '#ff8c00', '棕色': '#8b4513',
        '米色': '#f5f5dc', '藏青色': '#191970', '酒红色': '#722f37'
    };

    const qianData = [
        { name: '上上签', level: '大吉', poem: '云开月出正分明，不须进退问前程。\n婚姻皆由天注定，和合万事总安平。', tip: '万事顺遂，心想事成。' },
        { name: '上签', level: '吉', poem: '宝镜团圆似月明，琴瑟和鸣畅心情。\n婚姻总是前生定，从今富贵福禄增。', tip: '稳中有进，诸事可成。' },
        { name: '中签', level: '平', poem: '劝君切莫向他求，似鹤飞来暗箭投。\n若得明师相指点，前途自有一番新。', tip: '宜守旧待时，不可妄动。' },
        { name: '中签', level: '平', poem: '命中正逢罗孛关，用尽心机总未安。\n作福问神难得过，恰是行舟上高滩。', tip: '谨慎行事，以稳为先。' },
        { name: '下签', level: '小凶', poem: '一朝无事忽遭官，也是门衰坟未安。\n改过从新方得吉，莫将旧事反成冤。', tip: '遇事忍耐，不可强求。' },
        { name: '上签', level: '吉', poem: '灵芝生在大石边，异草奇花满地鲜。\n不但人见心欢喜，就是雀鸟也来朝。', tip: '贵人相助，好运将至。' },
        { name: '中签', level: '平', poem: '孤舟浪里过沙滩，起落浮沉总不安。\n若得顺风相送力，一时便有贵人看。', tip: '静待时机，终有转机。' },
        { name: '上上签', level: '大吉', poem: '万里晴空无片云，皓月皎洁照乾坤。\n内外一片光明象，作事求谋皆遂心。', tip: '光明坦途，所求皆成。' },
        { name: '下签', level: '小凶', poem: '病龙困在浅水滩，百般求脱总艰难。\n劝君莫作等闲看，早向神前把愿还。', tip: '宜多行善事，以求化解。' },
        { name: '中签', level: '平', poem: '风起云涌浪头高，一时进退两难逃。\n若得明灯相照路，不愁前路有波涛。', tip: '遇难莫慌，自有明路。' }
    ];

    let hasDrawn = false;
    let currentQian = null;
    let huangliData = null;

    function openBook() {
        const cover = document.getElementById('cover');
        const bookCover = document.getElementById('bookCover');
        bookCover.style.transform = 'rotateY(-100deg)';
        bookCover.style.opacity = '0';

        setTimeout(function() {
            cover.style.display = 'none';
            document.getElementById('pageWrap').style.display = 'flex';
            loadHuangLi();
        }, 700);
    }

    function loadHuangLi() {
        huangliData = getHuangliLocal();

        document.getElementById('solarDate').innerText = huangliData.solarDate;
        document.getElementById('lunarDate').innerText = huangliData.lunarDate;

        renderTerms(document.getElementById('yiText'), huangliData.yiArr, '宜');
        renderTerms(document.getElementById('jiText'), huangliData.jiArr, '忌');

        renderColors(document.getElementById('goodColor'), huangliData.goodColor);
        renderColors(document.getElementById('badColor'), huangliData.badColor);

        const noteEl = document.getElementById('noteText');
        noteEl.innerHTML = '';
        huangliData.notes.forEach(function(note) {
            if (!note || note.trim() === '' || note.includes('undefined')) return;
            const li = document.createElement('li');
            li.innerText = note;
            noteEl.appendChild(li);
        });
    }

    function renderTerms(container, arr, category) {
        container.innerHTML = '';
        if (!arr || arr.length === 0) {
            container.innerText = '无';
            return;
        }
        arr.forEach(function(word) {
            const tag = document.createElement('span');
            tag.className = 'term-tag';
            tag.innerText = word;
            tag.onclick = function() { showTermModal(word, category); };
            container.appendChild(tag);
        });
    }

    function renderColors(container, colorStr) {
        container.innerHTML = '';
        const colors = colorStr.split('、').map(function(c) { return c.trim(); }).filter(Boolean);
        colors.forEach(function(color, index) {
            const span = document.createElement('span');
            span.className = 'color-line';
            span.style.display = 'inline-flex';
            span.style.alignItems = 'center';
            span.style.gap = '6px';

            const swatch = document.createElement('span');
            swatch.className = 'color-swatch';
            swatch.style.backgroundColor = colorMap[color] || '#eeeeee';

            const text = document.createElement('span');
            text.innerText = color;

            span.appendChild(swatch);
            span.appendChild(text);
            container.appendChild(span);

            if (index < colors.length - 1) {
                const sep = document.createElement('span');
                sep.innerText = '、';
                container.appendChild(sep);
            }
        });
    }

    function showTermModal(word, category) {
        const info = getTermInfo(word, category);
        document.getElementById('termWord').innerText = word;
        document.getElementById('termCat').innerText = info.cat + ' · 词条释义';

        const body = document.getElementById('termBody');
        body.innerHTML =
            '<p><span class="label">含义：</span>' + info.meaning + '</p>' +
            '<p><span class="label">用法：</span>' + info.usage + '</p>';

        document.getElementById('termModalMask').classList.add('show');
    }

    function closeTermModal(event) {
        if (event && event.target !== event.currentTarget && event.target.className !== 'back-btn') {
            return;
        }
        document.getElementById('termModalMask').classList.remove('show');
    }

    function drawDivine() {
        if (hasDrawn) return;

        const randomIndex = Math.floor(Math.random() * qianData.length);
        currentQian = qianData[randomIndex];
        hasDrawn = true;

        const resultEl = document.getElementById('divineResult');
        resultEl.style.display = 'block';
        resultEl.innerHTML =
            '<div class="qian-name">' + currentQian.name + '</div>' +
            '<div class="qian-level">' + currentQian.level + '</div>' +
            '<div class="qian-poem">' + currentQian.poem + '</div>' +
            '<div style="margin-top:10px;color:#996633;">' + currentQian.tip + '</div>';

        document.getElementById('divineBtn').disabled = true;
        document.getElementById('downloadBtn').style.display = 'inline-block';
    }

    function downloadImage() {
        // 你的保存图片逻辑
    }
    </script>
