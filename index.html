<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>电子黄历</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 封面 -->
    <div id="cover" class="cover-wrap">
        <div class="book-cover" id="bookCover">
            <h1>电子黄历</h1>
            <p class="book-sub">择吉 · 观时 · 求签</p>
            <button class="open-btn" id="openBtn">打开电子黄历</button>
        </div>
    </div>

    <!-- 黄历页 -->
    <div id="pageWrap" class="book-page-wrap">
        <div class="book-page">
            <div class="date-title">
                <div id="solarDate">加载中...</div>
                <div id="lunarDate" class="lunar-date"></div>
            </div>

            <div class="grid-huangli">
                <div class="huangli-block">
                    <h3>✅ 宜（适合做）</h3>
                    <div id="yiText" class="term-list"></div>
                </div>

                <div class="huangli-block">
                    <h3>👔 推荐穿搭颜色</h3>
                    <p id="goodColor" class="color-line"></p>
                </div>

                <div class="huangli-block">
                    <h3>❌ 忌（避免）</h3>
                    <div id="jiText" class="term-list"></div>
                </div>

                <div class="huangli-block">
                    <h3>🚫 慎穿颜色</h3>
                    <p id="badColor" class="color-line"></p>
                </div>

                <div class="huangli-block full">
                    <h3>📌 今日注意事项</h3>
                    <ul id="noteText" class="note-list"></ul>
                </div>
            </div>

            <div class="divine-section">
                <button id="divineBtn" class="divine-btn">求签</button>
                <div id="divineResult" class="divine-result"></div>
                <button id="redrawBtn" class="redraw-btn" style="display:none;">不满意？再抽一次</button>
                <button id="historyBtn" class="history-btn" style="display:none;">查看抽签记录</button>
            </div>
        </div>
    </div>

    <!-- 词条弹窗 -->
    <div id="termModalMask" class="term-modal-mask">
        <div class="term-modal" id="termModal">
            <div class="term-word" id="termWord"></div>
            <div class="term-cat" id="termCat"></div>
            <div class="term-body" id="termBody"></div>
            <button class="back-btn" id="termBackBtn">返回电子黄历</button>
        </div>
    </div>

    <!-- 抽签记录弹窗 -->
    <div id="historyModalMask" class="term-modal-mask">
        <div class="term-modal history-modal" id="historyModal">
            <div class="history-title">你的三次抽签</div>
            <div class="history-list" id="historyList"></div>
            <div class="history-tip">✨ 三次签文，各有所示，相信你的第一直觉。</div>
            <button class="back-btn" id="historyBackBtn">返回电子黄历</button>
        </div>
    </div>

    <script src="lunar.js"></script>
    <script src="app.js"></script>
</body>
</html>
